services:
  postgres:
    image: postgres:latest
    container_name: notes_postgres
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes123
      POSTGRES_DB: notes_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - notes-network

volumes:
  postgres_data:

networks:
  notes-network:
    driver: bridge
